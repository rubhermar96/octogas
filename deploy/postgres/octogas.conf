# Ajustes de PostgreSQL para un VPS de 4 GB compartido con Nginx, la API y el build
# nocturno de Astro (que llega a ~1,5 GB). Se instala en conf.d/ y prevalece sobre
# los valores por defecto de postgresql.conf.
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
max_connections = 30
# Disco NVMe: el acceso aleatorio cuesta casi lo mismo que el secuencial.
random_page_cost = 1.1
checkpoint_completion_target = 0.9
wal_compression = on
