# OCTO — __DOMAIN__ (plantilla: setup.sh/update.sh sustituyen los __MARCADORES__).
# Web estática (Astro) servida desde la publicación actual + API Fastify detrás de /api y /r.

# Registro de accesos con la IP anonimizada (sin el último bloque), como dice la
# política de privacidad. logrotate (Debian) los borra a los 14 días.
map $remote_addr $octogas_anon_ip {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+$       $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+):        $ip::;
    default                            0.0.0.0;
}
log_format octogas_anon '$octogas_anon_ip - [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" $request_time';

# Acortador de enlaces: máx. 10 por minuto por IP (con ráfaga de 5).
limit_req_zone $binary_remote_addr zone=octogas_shorten:10m rate=10r/m;

upstream octogas_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

# HTTP → HTTPS (y retos de renovación de Let's Encrypt).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    access_log /var/log/nginx/octogas.access.log octogas_anon;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www → dominio sin www (una sola versión canónica para Google).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;
    access_log /var/log/nginx/octogas.access.log octogas_anon;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    access_log /var/log/nginx/octogas.access.log octogas_anon;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:octogas_ssl:10m;
    ssl_session_timeout 1d;

    root __WEB_ROOT__/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    include snippets/octogas-security-headers.conf;

    # Páginas. "/ruta" y "/ruta/" sirven el mismo index.html sin redirección; el
    # canonical de cada página apunta a la versión con barra final.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/octogas-security-headers.conf;
    }

    # JS/CSS/fuentes con hash en el nombre: no cambian nunca.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/octogas-security-headers.conf;
        access_log off;
    }

    # Datos de gasolineras: se regeneran dos veces al día.
    location ^~ /data/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=1800" always;
        include snippets/octogas-security-headers.conf;
    }

    # Imágenes, logos, iconos y vídeo: cambian rara vez.
    location ~ ^/(images|brands|icons|videos)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/octogas-security-headers.conf;
        access_log off;
    }

    # API (histórico, futura app móvil) y redirección de enlaces cortos.
    location /api/ {
        client_max_body_size 16k;
        include snippets/octogas-proxy.conf;
    }
    location = /api/shorten {
        limit_req zone=octogas_shorten burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include snippets/octogas-proxy.conf;
    }
    location /r/ {
        include snippets/octogas-proxy.conf;
    }

    # Ficheros ocultos (.env, .git...): nunca deberían estar publicados, pero por si acaso.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
