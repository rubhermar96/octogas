# Cabeceras de seguridad de OCTO. Se incluyen en el server y en cada location que
# añade sus propias cabeceras (en Nginx, un add_header en una location anula los heredados).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# strict-origin-when-cross-origin envía el dominio como Referer a las teselas de
# OpenStreetMap, que lo exige su política de uso.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
