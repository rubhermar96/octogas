# Configuración provisional (solo HTTP) mientras se obtiene el primer certificado.
# setup.sh la sustituye por octogas.conf en cuanto el certificado existe.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
